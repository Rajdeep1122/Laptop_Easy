{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center">List Your Laptop for Sale</h2>
                <p class="text-center text-muted">Your listing will be reviewed by an admin before it goes live.</p>
                <hr>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Submit Listing for Approval</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
